name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm run test:contracts
      - run: npm run contracts:check
      - run: npm run contracts:breaking
      - run: npm run scan:secrets
      - run: npm run scan:gitleaks
      - run: npm audit --audit-level=high
      - name: Integration tests with disposable Docker dependencies
        run: npm run test:integration
      - name: HTTP and gRPC end-to-end tests
        run: npm run test:e2e
      - name: Delivery and restart resilience tests
        run: npm run test:resilience

  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
      - run: npm run setup
      - run: docker compose config --quiet
      - run: docker compose build gateway
      - run: docker compose up -d --wait --wait-timeout 180
      - run: npm run demo
      - name: Container status
        if: always()
        run: docker compose ps
      - name: Remove disposable CI volumes
        if: always()
        run: docker compose down --volumes --remove-orphans
